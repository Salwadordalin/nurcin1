<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>barışalım mı?</title>
  <style>
    :root {
      --bg-1: #120d1d;
      --bg-2: #20172f;
      --panel: rgba(34, 27, 48, 0.7);
      --panel-border: rgba(255,255,255,0.12);
      --purple-1: #9b8cff;
      --purple-2: #6b5ce7;
      --pink-1: #ff7bbd;
      --pink-2: #e84393;
      --text: #f7f2ff;
      --muted: #d8d1ea;
      --success: #b9f7c9;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(155,140,255,0.25), transparent 28%),
        radial-gradient(circle at bottom right, rgba(255,123,189,0.2), transparent 24%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      position: relative;
    }

    .orb {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.42;
      pointer-events: none;
    }

    .orb.one {
      background: rgba(155,140,255,0.42);
      top: 4%;
      left: 8%;
      animation: drift 11s ease-in-out infinite alternate;
    }

    .orb.two {
      background: rgba(255,123,189,0.3);
      right: 10%;
      bottom: 6%;
      animation: drift 13s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(30px) scale(1.12); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(92vw, 440px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 34px 28px 30px;
      box-shadow: 0 20px 60px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
      text-align: center;
      overflow: hidden;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .container:hover {
      transform: translateY(-3px);
      box-shadow: 0 26px 72px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent 40%);
      pointer-events: none;
    }

    .title {
      margin-bottom: 16px;
      font-size: 0.84rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      font-weight: 700;
    }

    #mesajMetni {
      position: relative;
      z-index: 1;
      font-size: clamp(1.04rem, 2.6vw, 1.15rem);
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 30px;
      min-height: 102px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
    }

    .buttons {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      min-height: 62px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 14px 30px;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease, opacity 0.18s ease;
      position: relative;
      z-index: 2;
    }

    button:active {
      transform: scale(0.97);
    }

    #evetBtn {
      background: linear-gradient(135deg, var(--purple-1) 0%, var(--purple-2) 100%);
      color: white;
      box-shadow: 0 14px 28px rgba(107, 92, 231, 0.38);
    }

    #evetBtn:hover {
      filter: brightness(1.06);
    }

    #hayirBtn {
      background: linear-gradient(135deg, var(--pink-1) 0%, var(--pink-2) 100%);
      color: white;
      box-shadow: 0 14px 28px rgba(232, 67, 147, 0.32);
    }

    #hayirBtn:hover {
      filter: brightness(1.08);
    }

    .success-box {
      animation: fadeUp 0.6s ease-out both;
      display: grid;
      place-items: center;
      gap: 12px;
      padding: 10px 8px 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success-box h2 {
      font-size: clamp(1.85rem, 4vw, 2.3rem);
      color: var(--success);
      letter-spacing: 0.3px;
    }

    .success-box p {
      color: #ebf8ef;
      font-size: 1rem;
      line-height: 1.7;
    }

    .heart-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      opacity: 0;
      animation: showHearts 0.8s 0.2s ease forwards;
    }

    .heart {
      font-size: 1.35rem;
      animation: bounce 1.2s ease-in-out infinite alternate;
    }

    .heart:nth-child(2) { animation-delay: 0.2s; }
    .heart:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-4px) scale(1.14); }
    }

    @keyframes showHearts {
      to { opacity: 1; }
    }

    @media (max-width: 420px) {
      .container {
        padding: 28px 18px 24px;
      }

      .buttons {
        gap: 12px;
      }

      button {
        flex: 1 1 140px;
      }
    }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <div class="container" id="mainCard">
    <div class="title">bir şey sormak istiyorum</div>
    <p id="mesajMetni">selam hira. özledim valla, hatamın da farkındayım. bir daha aynı saçmalıkları yapmayacağıma söz veriyorum. bu siteyi de sırf bunun için hazırladım, uzatmayalım artık bence :)</p>

    <div class="buttons" id="buttonArea">
      <button id="evetBtn" onclick="evetTiklandi()">barışalım</button>
      <button id="hayirBtn" onmouseover="hayirKacir()" onclick="hayirKacir()">hayır</button>
    </div>
  </div>

  <script>
    const hayirMesajlari = [
      "emin misin?",
      "yanlış tuşa basıyosun farkındasın değil mi",
      "kaçabildiğin kadar kaç bakalım :)",
      "yok ya, oyle hemen hayır yok",
      "evet tuşu sol tarafta baksana bi",
      "zorlama istersen evete bas",
      "iyi madem, kaç bakalım",
      "kaçış yok, basıcaksın evete",
      "olmaz öyle şey, gel buraya",
      "biraz daha düşün, bu kadar kolay olmaz"
    ];

    let tiklamaSayisi = 0;

    function hayirKacir() {
      tiklamaSayisi++;

      const hayirBtn = document.getElementById('hayirBtn');
      const mesaj = document.getElementById('mesajMetni');

      const x = (Math.random() * 220) - 110;
      const y = (Math.random() * 120) - 60;

      hayirBtn.style.transform = `translate(${x}px, ${y}px)`;
      hayirBtn.style.transition = "transform 0.2s ease";

      const rastgeleMesaj = hayirMesajlari[Math.floor(Math.random() * hayirMesajlari.length)];
      mesaj.innerText = rastgeleMesaj;

      if (tiklamaSayisi > 5) {
        hayirBtn.style.opacity = "0";
        hayirBtn.style.pointerEvents = "none";
        hayirBtn.style.transform = "scale(0.2)";
      }
    }

    function evetTiklandi() {
      const card = document.getElementById('mainCard');
      card.innerHTML = `
        <div class="success-box">
          <h2>helal be :)</h2>
          <p>en güzeli oldu, uzatmaya gerek yoktu zaten. görüşürüz birazdan.</p>
          <div class="heart-row">
            <span class="heart">💜</span>
            <span class="heart">💗</span>
            <span class="heart">💖</span>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
